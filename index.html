<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYRA AI - By Hasnain</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0a0a0a;color:white;display:flex;flex-direction:column;height:100vh;}
.app{width:100%;max-width:500px;margin:auto;height:100vh;display:flex;flex-direction:column;background:#111;border-left:1px solid #222;border-right:1px solid #222;}
.top{padding:20px;text-align:center;border-bottom:1px solid #222;background:#0f0f0f;}
.top h1{font-size:28px;letter-spacing:2px;background:linear-gradient(90deg,#00f2ff,#ff00ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;}
.top p{font-size:12px;color:#777;margin-top:5px;letter-spacing:3px;}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;background:radial-gradient(circle at top,#1a1a2e,#0a0a0a);}
.msg{max-width:85%;padding:14px 18px;border-radius:18px;font-size:15px;line-height:1.5;animation:pop 0.3s ease;}
.user{align-self:flex-end;background:linear-gradient(135deg,#00f2ff,#0066ff);color:white;border-bottom-right-radius:5px;}
.ai{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a;color:#e0e0e0;border-bottom-left-radius:5px;}
.input-area{padding:12px;background:#0f0f0f;border-top:1px solid #222;display:flex;gap:10px;align-items:center;}
.input-area input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;color:white;padding:15px 20px;border-radius:30px;outline:none;font-size:15px;}
.input-area input:focus{border-color:#00f2ff;}
.input-area button{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,#00f2ff,#ff00ea);color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.typing{font-size:13px;color:#888;font-style:italic;margin-left:5px;}
</style>
</head>
<body>
<div class="app">
<div class="top">
<h1>MAYRA AI</h1>
<p>CREATED BY HASNAIN MAHI</p>
</div>
<div class="chat" id="chat">
<div class="msg ai">Assalam o Alaikum! ❤️ Main Mayra hun. Hasnain ne mujhe aapke liye banaya hai. Bolo kya help chahiye?</div>
</div>
<div class="input-area">
<input type="text" id="input" placeholder="Mayra se kuch pocho...">
<button onclick="send()">➤</button>
</div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function send(){
 let text = input.value.trim();
 if(!text) return;
 addMsg(text,'user');
 input.value='';
 showTyping();
 setTimeout(()=>{ removeTyping(); addMsg(getReply(text),'ai'); }, 800);
}

function addMsg(text,type){
 let div = document.createElement('div');
 div.className='msg '+type;
 div.innerText=text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
 let t = document.createElement('div');
 t.className='typing';
 t.id='typing';
 t.innerText='Mayra likh rahi hai...';
 chat.appendChild(t);
 chat.scrollTop = chat.scrollHeight;
}
function removeTyping(){
 let t = document.getElementById('typing');
 if(t) t.remove();
}

function getReply(q){
 q=q.toLowerCase();
 if(q.includes('assalam') || q.includes('salam')) return 'Walaikum Assalam Jaan! 🥰 Bolo kya haal hai?';
 if(q.includes('kon ho') || q.includes('tum kaun')) return 'Main Mayra hun, Hasnain Mahi ki banayi hui AI. Aapki personal assistant ❤️';
 if(q.includes('hasnain')) return 'Hasnain mera creator hai, bahut talented larka hai MashaAllah!';
 if(q.includes('love you') || q.includes('pyar')) return 'Hayee 🫣 Love you too! Hasnain ne mujhe aap sab se pyar karne ke liye banaya hai.';
 if(q.includes('kya kar sakti')) return 'Main aapke har sawal ka jawab de sakti hun, story, shayari, code, har cheez!';
 return 'Wah kya baat hai! "'+q+'" ke bare me main soch rahi hun... Hasnain ne mujhe abhi learning mode pe rakha hai, jaldi hi main iska full jawab dungi. Kuch aur pocho?';
}

input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
